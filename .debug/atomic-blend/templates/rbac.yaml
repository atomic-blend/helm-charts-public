
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backend-api
rules:
  
  - apiGroups:
    - ""
    resources:
    - pods
    verbs:
    - get
    - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend-rolebinding
roleRef: # points to the Role
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backend-api # name of Role
subjects: # points to the ServiceAccount
  - kind: ServiceAccount
    name: backend-sac # service account to bind to
    namespace: NAMESPACE