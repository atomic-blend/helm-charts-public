{{- range $serviceName, $serviceConfig := .Values.services }}
{{- $root := $ }}
{{- if ($serviceConfig.rbac).enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $serviceName }}-api
rules:
  {{ toYaml $serviceConfig.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $serviceName }}-rolebinding
roleRef: # points to the Role
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $serviceName }}-api # name of Role
subjects: # points to the ServiceAccount
  - kind: ServiceAccount
    name: {{ $serviceName }}-sac # service account to bind to
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end}}
{{- range $serviceName, $serviceConfig := .Values.services }}
{{- $root := $ }}
{{- if ($serviceConfig.rbac).enableAdminRbac }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $serviceName }}-admin-rolebinding
roleRef: # points to the Role
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin # name of Role
subjects: # points to the ServiceAccount
  - kind: ServiceAccount
    name: {{ $serviceName }}-sac # service account to bind to
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end}}