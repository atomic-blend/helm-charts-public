{{- /* Loop over services for SealedSecrets */}}
{{- range $serviceName, $serviceConfig := .Values.services }}
  {{- if and ($serviceConfig.sealedSecrets) ($serviceConfig.sealedSecrets.enabled) }}
    {{- $sealedSecrets := $serviceConfig.sealedSecrets.secrets }}
    {{- range $secretName, $secretConfig := $sealedSecrets }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Values.stackNamespace }}
  labels:
    {{- include "atomic-blend-component.labels" (dict "serviceName" $serviceName "Values" $.Values "Chart" $.Chart "Release" $.Release) | nindent 4 }}
  annotations:
    {{- with $secretConfig.annotations }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  encryptedData:
    {{- if $secretConfig.data }}
    {{- range $key, $value := $secretConfig.data }}
    {{ $key }}: {{ $value -}}
    {{- end }}
    {{- end }}
  template:
    metadata:
      name: {{ $secretName }}
      namespace: {{ $.Values.stackNamespace }}
      {{- with $secretConfig.labels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      type: {{ default "Opaque" $secretConfig.type }}
    {{- end }}
  {{- end }}
{{- end }}