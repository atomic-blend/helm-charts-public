suite: Test ab-component SealedSecrets
templates:
- sealed_secret.yaml
tests:
- it: should render a SealedSecret for each secret in the sealedSecrets config
  set:
    stackNamespace: default
    services:
      backend:
        sealedSecrets:
          enabled: true
          secrets:
            my-secret:
              data:
                key1: encrypted_value1
                key2: encrypted_value2
              type: Opaque
              labels:
                app: backend
              annotations:
                sealedsecrets.bitnami.com/cluster-wide: "true"
    manifest:
      backend:
        version: "1.0.0"
  asserts:
  - hasDocuments:
      count: 1
  - equal:
      path: metadata.name
      value: my-secret
  - equal:
      path: metadata.namespace
      value: default
  - equal:
      path: spec.encryptedData.key1
      value: encrypted_value1
  - equal:
      path: spec.encryptedData.key2
      value: encrypted_value2
  - equal:
      path: spec.template.metadata.name
      value: my-secret
  - equal:
      path: spec.template.metadata.namespace
      value: default
  - equal:
      path: spec.template.metadata.labels.app
      value: backend
  - equal:
      path: spec.template.spec.type
      value: Opaque
