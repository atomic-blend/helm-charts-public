suite: Test ab-component Services
templates:
- service.yaml
tests:
- it: should render a Service for each service in the map
  set:
    services:
      backend:
        service:
          type: ClusterIP
          ports:
          - port: 80
            targetPort: 8080
    manifest:
      backend:
        version: "1.0.0"
  asserts:
  - hasDocuments:
      count: 1
  - equal:
      path: metadata.name
      value: backend
  - equal:
      path: spec.type
      value: ClusterIP
  - equal:
      path: spec.ports[0].port
      value: 80
  - equal:
      path: spec.ports[0].targetPort
      value: 8080
