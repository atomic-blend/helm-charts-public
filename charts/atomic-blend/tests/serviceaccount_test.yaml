suite: Test ab-component ServiceAccounts
templates:
  - serviceaccount.yaml
tests:
  - it: should render a ServiceAccount for each service with serviceaccount enabled
    set:
      services:
        backend:
          serviceaccount:
            enabled: true
      manifest:
        backend:
          version: "1.0.0"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: backend-sac 