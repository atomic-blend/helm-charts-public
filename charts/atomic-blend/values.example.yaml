    cm:
      enabled: true
      values:
        GOOGLE_APPLICATION_CREDENTIALS: "/secrets/firebase-sac.json"
        FIREBASE_PROJECT_ID: "atomic-blend-prod"
        DATABASE_NAME: "ab-mail-prod"
        MAIL_AMQP_CONSUMER_EXCHANGE_NAMES: mail
        MAIL_AMQP_CONSUMER_QUEUE_NAME: received_mail_queue
        MAIL_AMQP_CONSUMER_ROUTING_KEYS: mail:received
        MAIL_AMQP_PRODUCER_EXCHANGE_NAMES: mail
        MAIL_AMQP_PRODUCER_QUEUE_NAME: sent_mail_queue
        MAIL_AMQP_PRODUCER_ROUTING_KEYS: mail:sent
        AWS_ENDPOINT: "https://s3.eu-central-003.backblazeb2.com"
        AWS_BUCKET: "ab-files-prod"
        AWS_DEFAULT_REGION: "eu-central-003"
        AWS_USE_PATH_STYLE_ENDPOINT: "false"
        RSPAMD_BASE_URL: "http://rspamd-ab-prod-rspamd:11333"
        RSPAMD_TIMEOUT_SECONDS: "30"
        RSPAMD_MAX_RETRIES: "3"
        CORS_ALLOWED_ORIGINS: "https://mail.atomic-blend.com"
        CORS_ALLOWED_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
        CORS_ALLOWED_HEADERS: "Content-Type,Authorization,X-Requested-With,Accept,Origin"
        CORS_ALLOW_CREDENTIALS: "true"

    secrets:
      enabled: false

    sealedSecrets:
      enabled: false
